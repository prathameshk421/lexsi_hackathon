[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frugal-analyst"
version = "0.1.0"
description = "Train a small model to answer analytics questions over SQLite cheaply."
requires-python = ">=3.12"
dependencies = []  # the core package uses the standard library only

[tool.setuptools]
packages = ["frugal_analyst"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
